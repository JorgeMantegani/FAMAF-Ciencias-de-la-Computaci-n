[General]
network = Network
sim-time-limit = 200s

Network.nodeTx.gen.packetByteSize = 12500
*.nodeTx.gen.generationInterval = exponential(${gi=0.1,0.2,0.5,1.0})
Network.gen.generationInterval=exponential(0.001)
Network.queue.serviceTime=exponential(0.001)

Network.nodeTx.txBuffer.bufferSize = 2000000
Network.queue.bufferSize = 200
Network.nodeRx.rxBuffer.bufferSize = 200

Network.feedbackQueue.serviceTime= 0


[Config Caso1]
description = "Control de Flujo"
*txToQueueDatarate = 1Mbps
*queueToRxDatarate = 1Mbps
*.nodeRx.rxToSinkDatarate = 0.5Mbps
*.linkDelay = 100us

[Config Caso2]
description = "Control de congestion"
*txToQueueDatarate = 1Mbps
*queueToRxDatarate = 0.5Mbps
*.nodeRx.rxToSinkDatarate = 1Mbps
*.linkDelay = 100us

[Config Caso3]
description = "Cuello de botella en el receptor"
